<style>:root{--bg:#f7f8fc;--card:#fff;--ink:#14162b;--mu:#7b8099;--ln:#e8eaf3;--F:#3d6bff;--M:#ff4f9a;--J:#12b5a0;--warn:#ffb020;
--sh:0 6px 24px rgba(40,50,110,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1120;--card:#191c31;--ink:#f2f3fa;--mu:#8b90ad;--ln:#272b47;--sh:none}}
:root[data-theme="dark"]{--bg:#0f1120;--card:#191c31;--ink:#f2f3fa;--mu:#8b90ad;--ln:#272b47;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",-apple-system,"Segoe UI",system-ui,sans-serif;max-width:560px;margin:0 auto;padding:14px 16px 110px}
button{font:inherit;color:inherit;cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.brand{font-weight:800;font-size:20px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}.logo{border-radius:7px;flex:none}
.yrs{display:flex;gap:6px;align-items:center}.pill{border:0;background:var(--card);padding:7px 13px;border-radius:99px;font-weight:600;font-size:13px;box-shadow:var(--sh);transition:.2s}
.pill.on{background:var(--ink);color:var(--bg)}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--sh);margin-bottom:14px}
h2{font-size:15px;margin:0 0 12px;font-weight:800}
.mu{color:var(--mu);font-size:12px}
.hero{display:flex;justify-content:center;position:relative;margin:4px 0 8px}
.ring{width:230px;height:230px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:15;stroke-linecap:round}
.ring .trk{stroke:var(--ln)}.ring .arc{transition:stroke-dasharray 1.1s cubic-bezier(.2,.8,.2,1)}
.mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.num{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.chip{background:var(--card);border-radius:18px;padding:12px;box-shadow:var(--sh)}
.chip b{display:block;font-size:17px;margin-top:3px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.prow{margin:12px 0}.prow .h{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:6px}
.trkb{height:10px;border-radius:9px;background:var(--ln);overflow:hidden}.trkb i{display:block;height:100%;border-radius:9px;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.tag{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700}
.ok{background:#12b5a025;color:var(--J)}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--ln);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.row:first-of-type{border-top:0}.row:active{opacity:.6}
.ic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:19px;flex:none;background:color-mix(in srgb,var(--cc,#7b8099) 14%,transparent);color:var(--cc,#7b8099)}
.gi{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.gi.sm{width:1.1em;height:1.1em;vertical-align:-.17em}
.crh .ic .gi{width:20px;height:20px}
.lmode{display:flex;background:#ffffff30;border-radius:99px;padding:3px}.lock .lmode button{background:none;color:#fff;padding:8px 16px;font-weight:700}.lock .lmode button.on{background:#fff;color:var(--ink)}.lgo{line-height:0}.lock .gbtn{background:#ffffff30;color:#fff}
.igrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:8px 0 4px;max-height:236px;overflow:auto;padding:2px}
.ig{aspect-ratio:1;border-radius:12px;border:1.5px solid var(--ln);background:var(--card);color:var(--ink);display:grid;place-items:center;padding:0}.ig .gi{width:24px;height:24px}.ig.on{border-color:var(--F);background:color-mix(in srgb,var(--F) 14%,transparent);color:var(--F)}
.fam .mem{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--ln)}.fam .mem:first-of-type{border-top:0}.fam .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.fam .row2{display:flex;gap:6px;margin-top:8px}.fam .row2 input{flex:1;min-width:0}

.g{flex:1;min-width:0}.t{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:800;font-size:14px}.pos{color:var(--J)}
.mchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:4px}
.mchips .pill{flex:none}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(560px,100%);display:flex;justify-content:space-around;background:var(--card);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));border-radius:24px 24px 0 0;box-shadow:0 -8px 30px rgba(40,50,110,.1);z-index:5}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mu);padding:6px 14px;border-radius:14px;transition:.2s}
.tab span{font-size:20px;transition:transform .25s}.tab.on{color:var(--ink)}.tab.on span{transform:translateY(-3px) scale(1.15)}
.fab{display:grid;place-items:center;padding:0;line-height:0;position:fixed;right:20px;bottom:calc(86px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--F),var(--M));color:#fff;font-size:30px;box-shadow:0 10px 24px rgba(61,107,255,.4);z-index:6;transition:transform .2s}
.fab:active{transform:scale(.9) rotate(90deg)}
.view{animation:fade .3s}@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.bars{display:flex;align-items:flex-end;gap:5px;height:130px;position:relative}
.avg{position:absolute;left:0;right:0;border-top:2px dashed var(--warn)}
.avg em{position:absolute;right:0;top:-18px;font-size:10px;font-style:normal;color:#b7740a;font-weight:700}
.dh{display:flex;align-items:center;gap:10px;margin:0 0 12px}.dh .pill{flex:none}.dnm{display:flex;align-items:center;gap:6px;font-weight:800;font-size:16px;min-width:0}
.donut{display:flex;flex-direction:column;gap:14px;align-items:center}
.donut svg{width:160px;height:160px;transform:rotate(-90deg)}.donut circle{fill:none;stroke-width:24;transition:stroke-width .2s;cursor:pointer}.donut circle:hover{stroke-width:30}
.leg{width:100%}.lg{display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 0;width:100%;background:none;border:0;text-align:left}
.lg .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lg b{min-width:38px;text-align:right}
input,select,textarea{width:100%;padding:11px 12px;border-radius:14px;border:1.5px solid var(--ln);background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
textarea{font-family:ui-monospace,monospace;font-size:12px;height:150px}
label{display:block;font-size:12px;color:var(--mu);margin:12px 0 4px;font-weight:600}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:10px 4px;border-radius:14px;border:2px solid var(--ln);background:none;font-weight:600;font-size:13px;transition:.15s}
.seg button.on{color:#fff;border-color:transparent}
.btn{width:100%;margin-top:14px;padding:14px;border:0;border-radius:16px;background:var(--ink);color:var(--bg);font-weight:800;font-size:15px}
.btn.s{background:var(--ln);color:var(--ink)}.btn.d{background:#e5484d;color:#fff}
dialog{border:0;border-radius:26px;padding:20px;width:min(440px,94vw);background:var(--card);color:var(--ink);max-height:90vh}
dialog::backdrop{background:rgba(10,12,30,.5);backdrop-filter:blur(3px)}
dialog[open]{animation:pop .25s cubic-bezier(.2,.9,.3,1.2)}@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.96)}}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:13px;font-weight:700;opacity:0;transition:.3s;z-index:20;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sw{display:flex;gap:8px;margin-top:6px}.sw i{width:26px;height:26px;border-radius:50%;cursor:pointer;border:3px solid transparent}.sw i.on{border-color:var(--ink)}
.sub{display:inline-block;background:var(--bg);border-radius:99px;padding:4px 10px;font-size:12px;margin:3px 4px 3px 0}
.lock{position:fixed;inset:0;background:linear-gradient(160deg,var(--F),var(--M));z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;padding:30px}
.lock.on{display:flex}.lock input{width:min(300px,100%);max-width:260px;text-align:center;background:#ffffff30;border:0;color:#fff}
.lock input::placeholder{color:#ffffffbb}.lock button{border:0;background:#fff;color:var(--ink);padding:12px 22px;border-radius:99px;font-weight:800}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.lock .err{color:#fff;font-size:13px;min-height:18px;text-align:center}
.lock .lnk{background:none;color:#fff;text-decoration:underline;padding:4px}

.empty{text-align:center;padding:28px 10px;color:var(--mu);font-size:14px}
.sub button{background:none;border:0;color:var(--mu);padding:0 0 0 6px}
.sub.arch{opacity:.45;text-decoration:line-through}
.mlab{display:grid;grid-template-columns:repeat(12,1fr);font-size:9px;color:var(--mu);text-align:center;margin-bottom:4px}

// aggiunge i movimenti ricorrenti mancanti fino a oggi: ognuno e' una copia dell'ultimo della serie
async function runRecurrences() {
  const today = iso(new Date()); let made = 0;
  for (const r of Object.values(S.rec)) {
    if (!r.active) continue;
    const mem = recMembers(r.id), last = mem[mem.length - 1]; if (!last) continue;
    const dates = []; for (let k = 1; k < 800 && dates.length < 60; k++) { const d = recDate(r.anchor, r.freq, k); if (d > today) break; if (d > last.d) dates.push(d); }
    for (const d of dates) {
      const { error } = await sb.from("transactions").insert({ kind: last.k === "s" ? "spesa" : "versamento", amount_cents: Math.round(last.a * 100), tx_date: d, category_id: last.cat || null, subcategory_id: last.sub || null, payer: last.who, note: last.note, rec_id: r.id, auto: true });
      if (!error) made++;
    }
  }
  if (made) { await loadAll(); render(); toast(made === 1 ? "Registrato 1 movimento ricorrente" : `Registrati ${made} movimenti ricorrenti`); }
}

/* ---------------- calcoli ---------------- */
const cat = id => S.cats.find(c => c.id === id) || { n: "Versamento", c: "#12b5a0", i: "coins", subs: [] };
const subN = (c, s) => (cat(c).subs.find(x => x.id === s) || {}).n || "";
const years = () => [...new Set([CY, ...S.tx.map(x => +x.d.slice(0, 4)), ...Object.keys(S.quota).map(Number)])].sort();

// quota di un anno: se non è stata impostata, vale quella dell'ultimo anno precedente che ce l'ha
function quotaFrom(y) { const k = Object.keys(S.quota).map(Number).filter(x => x <= y).sort((p, q) => q - p)[0]; return k === undefined ? null : k; }
const quotaOf = y => { const k = quotaFrom(y); return k === null ? 0 : S.quota[k]; };

// totali di un anno: spese, versamenti, quote e conguaglio; cin = credito riportato dall'anno prima
function Y(y, cin) {
  const t = S.tx.filter(x => +x.d.slice(0, 4) === y), sp = t.filter(x => x.k === "s"), vr = t.filter(x => x.k === "v");
  const am = a => sum(a.map(x => x.a)), spent = am(sp), open = y >= CY, cd = open ? Math.max(1, CM) : 12;
  const pk = { P1: am(sp.filter(x => x.who === "P1")), P2: am(sp.filter(x => x.who === "P2")) }, jt = am(sp.filter(x => x.who === "J"));
  const vs = { P1: am(vr.filter(x => x.who === "P1")), P2: am(vr.filter(x => x.who === "P2")) };
  const mo = (a, m) => a.filter(x => +x.d.slice(5, 7) === m + 1);
  const spM = Array.from({ length: 12 }, (_, m) => am(mo(sp, m)));
  const vrM = Array.from({ length: 12 }, (_, m) => am(mo(vr, m)) + am(mo(sp, m).filter(x => x.who !== "J")));
  let proj = spent;
  if (open) {
    const prev = S.tx.filter(x => x.k === "s" && +x.d.slice(0, 4) === y - 1), avg = spent / cd;
    for (let m = cd; m < 12; m++) proj += prev.length ? .5 * avg + .5 * am(mo(prev, m)) : avg;
  }
  const Q = quotaOf(y), integr = Math.max(0, proj / 2 - 12 * Q), c = { P1: vs.P1 + pk.P1, P2: vs.P2 + pk.P2 };
  const dov = {}, cred = {};
  ["P1", "P2"].forEach(p => {
    const ex = Math.max(0, c[p] - Q * cd) + cin[p];
    dov[p] = Math.max(0, integr - ex); cred[p] = Math.max(0, ex - integr);
  });
  const ent = c.P1 + c.P2 + cin.P1 + cin.P2 + 2 * Q * (12 - cd); // entrate stimate a fine anno: versato finora + quota sui mesi rimanenti
  return { y, spent, pk, vs, c, spM, vrM, proj, Q, integr, dov, cred, cin, ent, delta: ent - proj, rec: Q + integr / 12, saldo: vs.P1 + vs.P2 - jt, open, cd, credNext: cred };
}
// Y con cache: calcola gli anni in ordine cosi' il credito di fine anno passa a quello dopo
function YD(y) {
  if (!YC[y]) {
    YC = {}; let carry = { P1: 0, P2: 0 };
    for (const yy of years()) { const d = Y(yy, carry); YC[yy] = d; carry = d.open ? { P1: 0, P2: 0 } : d.credNext; }
  }
  return YC[y] || Y(y, { P1: 0, P2: 0 });
}

  if (!cats.length) return `<div class="view"><div class="card"><h2>Spese ${y}</h2><div class="empty">Nessuna spesa registrata nel ${y}.</div></div></div>`;
  if (S.drill && !cats.some(c => c.id === S.drill)) S.drill = null;
  const mx = cats[0].v;
  const bars = cats.map(c => `<div class="hrow"><span class="hl"><span class="dot" style="background:${c.c}"></span>${ico(c.i, 1)} ${esc(c.n)}</span><span class="trkb"><i data-w="${c.v / mx * 100}" style="background:${c.c}"></i></span><b class="hv">${eur(c.v)}</b></div>`).join("");
  return `<div class="view"><div class="card"><h2>Spese per categoria · ${y}</h2><div class="hb">${bars}</div></div>
 <div class="card" id="ovd">${overDonut()}</div></div>`;
}
function overDonut() {
  const y = S.year, sp = S.tx.filter(x => x.k === "s" && yOf(x) === y);
  const cats = S.cats.map(c => ({ id: c.id, n: c.n, i: c.i, c: c.c, v: sum(sp.filter(x => x.cat === c.id).map(x => x.a)) })).filter(i => i.v > 0).sort((p, q) => q.v - p.v);
  let items, ctr, head;
  if (S.drill) {
    const c = cat(S.drill), by = {};
    sp.filter(x => x.cat === S.drill).forEach(x => by[x.sub] = (by[x.sub] || 0) + x.a);
    const arr = Object.entries(by).sort((p, q) => q[1] - p[1]);
    items = arr.map(([s, v], i) => ({ n: subN(S.drill, s) || "Senza sottocategoria", v, c: shade(c.c, i, arr.length), id: "" }));
    ctr = c.n; head = `<div class="dh"><button class="pill" data-act="drill" data-id="">← Categorie</button><span class="dnm">${ico(c.i, 1)} ${esc(c.n)}</span></div>`;
  } else {
    items = cats.map(c => ({ n: c.n, v: c.v, c: c.c, id: c.id })); ctr = "spese " + y; head = "<h2>Dove vanno i soldi</h2>";
  }
  const tt = sum(items.map(i => i.v));
  return `${head}${donut(items, tt, ctr)}${S.drill ? "" : "<div class='mu' style='margin-top:6px'>Tocca una categoria per vedere le sottocategorie.</div>"}`;
}

/* ---- grafico a linee: mesi in ascissa, spesa in ordinata ---- */
function lineBlock(series, opt = {}) {
  const lm = ST.lm ?? ((CM + 11) % 12), W = 340, H = opt.h || 176, l = 36, r = 6, t = 8, b = 20, cw = (W - l - r) / 11, sfx = opt.cum ? " (cumulato)" : "";
  const top = Math.max(1, ...series.flatMap(s => s.v.filter(v => v !== null))), raw = top / 4, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const st = [1, 2, 5, 10].map(f => f * mag).find(s => s >= raw), nm = st * 4;
  const x = i => l + i * cw, y = v => t + (H - t - b) * (1 - v / nm);
  const grid = [0, 1, 2, 3, 4].map(k => `<line x1="${l}" x2="${W - r}" y1="${y(k * st)}" y2="${y(k * st)}" style="stroke:var(--ln)"/><text x="${l - 5}" y="${y(k * st) + 3}" text-anchor="end" style="fill:var(--mu);font-size:9px">${kfmt(k * st)}</text>`).join("");
  const xl = MESI.map((m, i) => `<text x="${x(i)}" y="${H - 5}" text-anchor="middle" style="fill:var(--mu);font-size:8.5px">${m}</text>`).join("");
  const hl = `<rect x="${x(lm) - cw / 2}" y="${t}" width="${cw}" height="${H - t - b}" rx="4" style="fill:var(--ln);opacity:.55"/>`;
  const hit = MESI.map((_, i) => `<rect x="${x(i) - cw / 2}" y="${t}" width="${cw}" height="${H - t - b}" fill="transparent" data-act="lm" data-i="${i}" style="cursor:pointer"/>`).join("");
  const paths = series.map(s => {
    let d = "", pen = false;
    s.v.forEach((v, i) => { if (v === null) { pen = false; return; } d += (pen ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1); pen = true; });
    return `<path d="${d}" fill="none" style="stroke:${s.c}" stroke-width="${s.dash ? 2.5 : 2}" ${s.dash ? `stroke-dasharray="${s.dp || "5 4"}"` : ""} stroke-linejoin="round" stroke-linecap="round"/>` +
      (s.dash ? "" : s.v.map((v, i) => v === null ? "" : `<circle cx="${x(i)}" cy="${y(v)}" r="3" data-act="lm" data-i="${i}" style="fill:${s.c};stroke:var(--card);stroke-width:1.5;cursor:pointer"><title>${s.n} · ${MESI[i]}${sfx}: ${eur(v)}</title></circle>`).join(""));
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Spesa mensile, un tracciato per anno">${hl}${grid}${xl}${hit}${paths}</svg>
 <div class="legend">${series.map(s => `<span class="lgi">${s.dash ? `<svg width="18" height="6" style="margin-right:6px"><line x1="0" x2="18" y1="3" y2="3" style="stroke:${s.c};stroke-width:2.5;stroke-dasharray:${s.dp ? "2 3" : "4 3"}"/></svg>` : `<span class="dot" style="background:${s.c}"></span>`}${s.n}</span>`).join("")}</div>
 <div class="sbox ro"><div class="rt"><b>${cap(MESI_L[lm])}</b>${sfx ? ` <span class="mu">(cumulato)</span>` : ""}</div>
  ${series.filter(s => s.v[lm] !== null && (s.pj === undefined || lm >= s.pj)).map(s => `<div class="rr"><span><span class="dot" style="background:${s.c}"></span>${s.n}</span> <b>${eur(s.v[lm])}</b></div>`).join("")}
  <div class="cap">Tocca un mese sul grafico per vedere i valori.</div></div>`;
}

/* ---- proiezione dei mesi mancanti dell'anno in corso, sottocategoria per sottocategoria ----
   con 2+ anni di storico: spesa media storica del mese x ritmo di quest'anno (rapporto tra il speso finora e lo storico nello stesso periodo, limitato tra 0,5 e 1,5);
   con un solo anno di storico: metà ritmo di quest'anno, metà anno scorso. */
function projectYear(f, hist) {
  const L = lim(CY), out = Array(12).fill(0), seen = new Set();
  S.tx.forEach(x => { if (x.k === "s" && f(x) && (yOf(x) === CY || hist.includes(yOf(x)))) seen.add(x.cat + "|" + x.sub); });
  seen.forEach(key => {
    const [c, s] = key.split("|"), g = x => x.cat === c && x.sub === s;
    const ytd = sum(mser(CY, g).slice(0, L).map(v => v || 0)), hs = hist.map(y => mser(y, g));
    const hm = Array.from({ length: 12 }, (_, m) => sum(hs.map(a => a[m])) / hs.length), hy = sum(hm.slice(0, L));
    for (let m = L; m < 12; m++) {
      if (hist.length < 2) out[m] += .5 * ytd / L + .5 * hm[m];
      else if (hy > 0) out[m] += hm[m] * Math.min(1.5, Math.max(.5, ytd / hy));
      else out[m] += ytd > 0 ? ytd / L : hm[m];
    }
  });
  return out;
}


/* ---- Suggerimenti: spunti calcolati dai dati, ognuno con il numero da cui nasce ---- */
function statsTips() {
  const Y = S.year, cur = Y === CY, tips = [], pc = v => (v > 0 ? "+" : "−") + Math.abs(Math.round(v * 100)) + "%";
  const withSpend = y => S.tx.some(x => x.k === "s" && yOf(x) === y), sp = y => spend(x => yOf(x) === y);
  const prev = years().filter(y => y < Y && withSpend(y)), ph = prev.filter(y => y >= Y - 3), L = lim(Y);
  if (!withSpend(Y)) return `<h2>Suggerimenti ${Y}</h2><div class="empty">Nessuna spesa nel ${Y}: niente da analizzare.</div><button class="btn s" data-act="close">Chiudi</button>`;
  // 1. proiezione di fine anno
  if (cur && ph.length) {
    const pr = projectYear(() => true, ph), ytd = sum(mser(Y, () => true).slice(0, L).map(v => v || 0)), tot = ytd + sum(pr.slice(L)), py = prev.includes(Y - 1) ? sp(Y - 1) : null;
    if (py) { const d = (tot - py) / py; tips.push({ k: Math.abs(d) < .05 ? "in" : d > 0 ? "up" : "dn", i: "📈", t: `Fine anno ${Y}: circa ${eur(tot)}`, x: `Al ritmo attuale chiuderete l'anno ${Math.abs(d) < .005 ? "in linea con" : pc(d) + " rispetto a"} il ${Y - 1} (${eur(py)}). È una stima: non prevede spese straordinarie.`, go: ["trend", null] }); }
  }
  // 2. rata
  const d = YD(Y);
  if (d.Q && d.rec) {
    const r = d.rec / d.Q, cong = d.dov.P1 + d.dov.P2;
    tips.push({ k: r > 1.03 ? "up" : r < .97 ? "dn" : "in", i: "⚖️", t: r > 1.03 ? "La quota mensile non basta" : r < .97 ? "La quota mensile è più alta del necessario" : "La quota mensile è in linea",
      x: `Con le spese ${cur ? "stimate" : "del " + Y} la rata a testa che azzera il conguaglio è ${eur(d.rec)} al mese; la vostra è ${eur(d.Q)}.${cong >= 50 ? ` Il conguaglio previsto è ${eur(cong)}.` : ""}` });
  }
  // 3. categorie lontane dalla norma
  const baseY = cur ? ph : prev.includes(Y - 1) ? [Y - 1] : [], mo = cur ? L : 12;
  if (baseY.length) {
    const cs = S.cats.map(c => { const a = sum(mser(Y, x => x.cat === c.id).slice(0, mo).map(v => v || 0)), b = sum(baseY.map(y => sum(mser(y, x => x.cat === c.id).slice(0, mo).map(v => v || 0)))) / baseY.length; return { c, a, b, diff: a - b, r: b ? (a - b) / b : 0 }; }).filter(z => z.b >= 150 && Math.abs(z.r) >= .15 && Math.abs(z.diff) >= 100);
    const ups = cs.filter(z => z.diff > 0).sort((p, q) => q.diff - p.diff).slice(0, 2), dns = cs.filter(z => z.diff < 0).sort((p, q) => p.diff - q.diff).slice(0, 1);
    [...ups, ...dns].forEach(z => tips.push({ k: z.diff > 0 ? "up" : "dn", i: "🏷️", t: `${z.c.n}: ${pc(z.r)} rispetto al solito`, x: `${cur ? `Da gennaio a ${MESI_L[L - 1]}` : `Nel ${Y}`} avete speso ${eur(z.a)} contro ${eur(z.b)} ${cur ? `di media dello stesso periodo (${yLabel(baseY)})` : `del ${Y - 1}`}: ${z.diff > 0 ? "+" : "−"}${eur(Math.abs(z.diff))}.`, go: ["trend", z.c.id] }));
  }
  // 4. spese singole molto sopra il tipico
  const out = [];
  S.tx.filter(x => x.k === "s" && yOf(x) === Y && x.a >= 100).forEach(x => {
    const h = S.tx.filter(z => z.k === "s" && z.cat === x.cat && z.sub === x.sub && yOf(z) < Y).map(z => z.a).sort((p, q) => p - q);
    if (h.length >= 3) { const med = h[Math.floor(h.length / 2)]; if (med > 0 && x.a >= 2.5 * med) out.push({ x, med, r: x.a / med }); }
  });
  out.sort((p, q) => q.r - p.r).slice(0, 2).forEach(o => tips.push({ k: "up", i: "🔎", t: `${subN(o.x.cat, o.x.sub) || cat(o.x.cat).n}: ${eur(o.x.a)}`, x: `Il ${fdt(o.x.d)} è stata registrata una spesa pari a ${(Math.round(o.r * 10) / 10).toString().replace(".", ",")} volte il valore tipico di questa voce (${eur(o.med)}).`, edit: o.x.id }));
  // 5. voci regolari che mancano
  if (cur && L >= 3) {
    const miss = [];
    S.cats.forEach(c => c.subs.forEach(sb_ => {
      const g = x => x.cat === c.id && x.sub === sb_.id, py = mser(Y - 1, g), m = py.filter(v => v > 0).length, ty = mser(Y, g);
      if (m >= 9 && !(ty[L - 1] > 0) && !(ty[L - 2] > 0)) { let n = 0; for (let i = L - 1; i >= 0 && !(ty[i] > 0); i--) n++; miss.push({ c, s: sb_, n }); }
    }));
    miss.slice(0, 2).forEach(z => tips.push({ k: "in", i: "❓", t: `${z.s.n}: manca da ${z.n} mes${z.n === 1 ? "e" : "i"}`, x: `${z.c.n} › ${z.s.n} lo scorso anno compariva quasi ogni mese; nel ${Y} non ci sono movimenti da ${MESI_L[L - z.n]}.`, go: ["trend", z.c.id] }));
  }
  // 6. aumenti per piu' anni di fila (anni completi)
  const full = years().filter(y => y < CY && withSpend(y)), last = full[full.length - 1];
  if (last !== undefined) {
    const gr = [];
    S.cats.forEach(c => {
      const t = full.map(y => spend(x => yOf(x) === y && x.cat === c.id)); let n = 0, rs = [];
      for (let i = t.length - 1; i > 0 && t[i - 1] > 0 && t[i] > t[i - 1] * 1.02; i--) { n++; rs.unshift(t[i] / t[i - 1] - 1); }
      if (n >= 3 && t[t.length - 1] >= 300) gr.push({ c, n, rs, avg: sum(rs) / n });
    });
    gr.sort((p, q) => q.avg - p.avg).slice(0, 2).forEach(z => tips.push({ k: "up", i: "📊", t: `${z.c.n}: in aumento da ${z.n} anni`, x: `Ogni anno più dell'anno prima (${z.rs.map(pc).join(", ")}), fino al ${last}.`, go: ["trend", z.c.id] }));
  }
  // 7. ricorrenze
  const act = Object.values(S.rec).filter(r => r.active).map(r => ({ r, l: recMembers(r.id).pop() })).filter(z => z.l && z.l.k === "s");
  if (act.length) { const m = sum(act.map(({ r, l }) => l.a * (r.freq === "w" ? 52 / 12 : r.freq === "y" ? 1 / 12 : 1))); tips.push({ k: "in", i: "↻", t: `${act.length} spese ricorrenti attive`, x: `Pesano circa ${eur(m)} al mese, ${eur(m * 12)} all'anno.`, tab: "sett" }); }
  const list = tips.slice(0, 4);
  return `<h2>Suggerimenti ${Y}</h2>
  ${list.map(t => `<div class="tip tk-${t.k}"><span class="ti">${t.i}</span><div class="g"><div class="tt">${esc(t.t)}</div><div class="tx">${esc(t.x)}</div>
   ${t.go ? `<button class="pill" data-act="tipgo" data-fc="${t.go[1] || ""}">Vedi nel grafico</button>` : t.edit ? `<button class="pill" data-act="edit" data-id="${t.edit}">Apri il movimento</button>` : t.tab ? `<button class="pill" data-act="tab" data-t="sett">Vedi le ricorrenze</button>` : ""}</div></div>`).join("") || `<div class="empty">Per ora non ci sono spunti: servono più mesi di dati.</div>`}
  <div class="mu" style="margin-top:10px;font-size:12px">Spunti calcolati sui vostri dati, senza giudizi: servono a notare cose che altrimenti sfuggono. Non sono consigli finanziari.</div><button class="btn s" data-act="close">Chiudi</button>`;
}

/* ---- Andamento: filtri, anni a scelta, media dei 3 anni precedenti, mensile o cumulato ---- */
function statsTrend() {
  const all = ysp();
  if (!all.length) return EMPTY;
  const cs = S.cats.filter(c => spend(x => x.cat === c.id) > 0);
  if (ST.fc && !cs.some(c => c.id === ST.fc)) ST.fc = null;
  const cc = ST.fc ? cat(ST.fc) : null, sbs = cc ? cc.subs.filter(s => spend(x => x.cat === cc.id && x.sub === s.id) > 0) : [];
  if (ST.fs && !sbs.some(s => s.id === ST.fs)) ST.fs = null;
  const f = x => (!ST.fc || x.cat === ST.fc) && (!ST.fs || x.sub === ST.fs);
  const selY = ST.yrs === null ? all.slice(-4) : ST.yrs.filter(y => all.includes(y));
  const pool = all.filter(y => y < CY), nMax = 10;
  const prev3 = pool.filter(y => y >= CY - ST.navg), ph = pool.filter(y => y >= CY - ST.nproj);   // prev3: anni della media; ph: anni dello storico per la proiezione (indipendenti)   // gli N anni di calendario prima di quello in corso (N scelto, di norma 3); contano quelli con spese
  const sers = all.filter(y => selY.includes(y)).map(y => { const v = mser(y, f); return { n: String(y), c: yc(y), v: ST.cum ? cumul(v) : v }; });
  let projNote = "";
  const canProj = ST.proj && ph.length && selY.includes(CY) && spend(x => yOf(x) === CY && f(x)) > 0;
  if (canProj) {
    const L = lim(CY), pr = projectYear(f, ph), act = mser(CY, f).map(v => v === null ? null : v);
    const base = ST.cum ? cumul(act) : act, pv = Array(12).fill(null);
    pv[L - 1] = base[L - 1];
    for (let m = L; m < 12; m++) pv[m] = ST.cum ? pv[m - 1] + pr[m] : pr[m];
    sers.push({ n: CY + " proiezione", c: yc(CY), dash: true, dp: "2 4", pj: L, v: pv });
    const ytdT = sum(act.slice(0, L)), totE = ytdT + sum(pr.slice(L)), avgY = sum(ph.map(y => spend(x => yOf(x) === y && f(x)))) / ph.length;
    const dp = avgY ? Math.round((totE - avgY) / avgY * 100) : null;
    projNote = `<div class="sbox"><div class="cap">Proiezione ${CY}, fine anno</div><div class="big" style="margin:4px 0">${eur(totE)}</div>${dp === null ? "" : `<div>${dchip(totE, avgY)} <span class="mu">rispetto alla media ${yLabel(ph)} (${eur(avgY)})</span></div>`}
      <details><summary>Come è calcolata</summary><div class="mu" style="margin-top:6px">La linea punteggiata stima i mesi da ${MESI_L[L]} in poi ${ph.length > 1 ? `con la stagionalità del periodo ${yLabel(ph)} e il ritmo di quest'anno` : "dal ritmo di quest'anno e dall'anno scorso"}. Non prevede spese straordinarie.</div></details></div>`;
  }
  if (ST.avg && prev3.length) {
    const pm = prev3.map(y => mser(y, f)), avgV = Array.from({ length: 12 }, (_, m) => sum(pm.map(a => a[m])) / pm.length);
    sers.push({ n: "Media " + yLabel(prev3), c: "var(--mu)", dash: true, v: ST.cum ? cumul(avgV) : avgV });
  }
  const label = ST.fs ? `${cc.n} › ${(cc.subs.find(s => s.id === ST.fs) || {}).n}` : cc ? cc.n : "Tutte le spese";
  const avgNote = !ST.avg ? "" : prev3.length ? `La linea tratteggiata è la media ${prev3.length < ST.navg ? `degli anni con dati tra il ${CY - ST.navg} e il ${CY - 1} (${yLabel(prev3)})` : `${prev3.length === 1 ? "dell'anno" : `dei ${prev3.length} anni`} prima del ${CY} (${yLabel(prev3)})`}.` : `Non ci sono anni prima del ${CY} per calcolare la media.`;
  const opt = (id, v, name) => `<option value="${id}" ${id === v ? "selected" : ""}>${name}</option>`;
  const ysum = selY.length === all.length ? "Tutti gli anni" : !selY.length ? "Nessun anno" : selY.length <= 3 ? selY.join(", ") : selY.length + " anni";
  const ychips = `<div class="ddw"><button class="dd" id="ydd" data-act="ydd" aria-expanded="${!!ST.ydd}">${ysum} <span class="chev">▾</span></button>${ST.ydd ? `<div class="ddp"><label class="ck"><input type="checkbox" id="yall" data-part="${selY.length && selY.length < all.length ? 1 : 0}" ${selY.length === all.length ? "checked" : ""}>(Seleziona tutto)</label>${[...all].reverse().map(y => `<label class="ck"><input type="checkbox" data-yk="${y}" ${selY.includes(y) ? "checked" : ""}><span class="dot" style="background:${yc(y)}"></span>${y}</label>`).join("")}<button class="btn s" data-act="ydd" style="margin-top:8px;padding:9px">OK</button></div>` : ""}</div>`;
  return `<div class="view"><div class="card"><h2>Andamento della spesa</h2>
  <div class="frow" style="margin-top:0"><button class="pill ${ST.cum ? "" : "on"}" data-act="ycum" data-v="0">Mensile</button><button class="pill ${ST.cum ? "on" : ""}" data-act="ycum" data-v="1">Cumulato</button></div>
  <div class="two" style="margin-top:12px"><div><label for="sfc" style="margin-top:0">Categoria</label><select id="sfc">${opt("", ST.fc || "", "Tutte")}${cs.map(c => opt(c.id, ST.fc, esc(c.n))).join("")}</select></div>
  <div><label for="sfs" style="margin-top:0">Sottocategoria</label><select id="sfs" ${cc ? "" : "disabled"}>${opt("", ST.fs || "", "Tutte")}${sbs.map(s => opt(s.id, ST.fs, esc(s.n))).join("")}</select></div></div>
  <div class="frow">${ychips}</div>
  ${pool.length ? `<div class="frow" style="margin-top:6px"><label class="ck" style="margin:0;padding:6px 4px;border:0;border-radius:8px"><input type="checkbox" data-act="savg" ${ST.avg ? "checked" : ""}>Media sugli ultimi</label><select id="navg" aria-label="Anni nella media" style="width:auto;padding:8px 10px">${Array.from({ length: nMax }, (_, k) => k + 1).map(n => `<option value="${n}" ${n === ST.navg ? "selected" : ""}>${n} ${n === 1 ? "anno" : "anni"}</option>`).join("")}</select></div>` : ""}
  ${pool.length && selY.includes(CY) ? `<div class="frow" style="margin-top:6px"><label class="ck" style="margin:0;padding:6px 4px;border:0;border-radius:8px"><input type="checkbox" data-act="sproj" ${ST.proj ? "checked" : ""}>Proiezione ${CY} sugli ultimi</label><select id="nproj" aria-label="Anni di storico per la proiezione" style="width:auto;padding:8px 10px">${Array.from({ length: nMax }, (_, k) => k + 1).map(n => `<option value="${n}" ${n === ST.nproj ? "selected" : ""}>${n} ${n === 1 ? "anno" : "anni"}</option>`).join("")}</select></div>` : ""}
  ${sers.length ? lineBlock(sers, { h: 230, cum: ST.cum }) : `<div class="empty">Seleziona almeno un anno.</div>`}
  ${projNote}<ul class="notes"><li>Filtro: ${esc(label)}${ST.cum ? ", cumulato da gennaio" : ""}.</li>${avgNote ? `<li>${avgNote}</li>` : ""}<li>Il mese in corso non è incluso nei dati reali.</li></ul></div></div>`;
}

/* ---- YtY: due anni a confronto, annuale o mese per mese ---- */
function statsYty() {
  const all = ysp();
  if (all.length < 2) return `<div class="view"><div class="card"><h2>Confronto Anni</h2><div class="empty">Servono almeno due anni con spese per fare il confronto.</div></div></div>`;
  if (!all.includes(ST.ya) || !all.includes(ST.yb) || ST.ya === ST.yb) { ST.ya = all[all.length - 2]; ST.yb = all[all.length - 1]; }
  const A = ST.ya, B = ST.yb, annual = ST.ymode === "year", Lc = Math.min(lim(A), lim(B));
  // il confronto a parità di periodo usa solo mesi chiusi in entrambi gli anni
  const mOpts = Array.from({ length: Lc }, (_, m) => m).filter(m => spend(x => mOf(x) === m && (yOf(x) === A || yOf(x) === B)) > 0);
  if (!mOpts.includes(ST.ym)) ST.ym = mOpts.length ? mOpts[mOpts.length - 1] : null;
  const dotY = y => `<span class="dot" style="background:${yc(y)}"></span>`;
  const ysel = (id, v) => `<select id="${id}">${[...all].reverse().map(y => `<option value="${y}" ${y === v ? "selected" : ""}>${y}</option>`).join("")}</select>`;
  const head = `<div class="card"><h2>Confronto Anni</h2>
 <div class="two"><div><label for="yya" style="margin-top:0">${dotY(A)}Primo anno</label>${ysel("yya", A)}</div><div><label for="yyb" style="margin-top:0">${dotY(B)}Secondo anno</label>${ysel("yyb", B)}</div></div>
 <div class="frow"><button class="pill ${annual ? "on" : ""}" data-act="ymode" data-v="year">Annuale</button><button class="pill ${annual ? "" : "on"}" data-act="ymode" data-v="month">Mensile</button>
 ${!annual && mOpts.length ? `<select id="yym" aria-label="Mese" style="flex:1;min-width:130px;width:auto">${mOpts.map(m => `<option value="${m}" ${m === ST.ym ? "selected" : ""}>${cap(MESI_L[m])}</option>`).join("")}</select>` : ""}</div>
 <div class="mu" style="margin-top:8px">${annual ? (Lc < 12 ? `Confronto su gen–${MESI[Lc - 1].toLowerCase()}, i mesi chiusi in entrambi gli anni.` : "Confronto sull'anno intero.") : "Si confronta lo stesso mese nei due anni. Il mese in corso non è incluso."}</div></div>`;
  if (!annual && ST.ym === null) return `<div class="view">${head}<div class="card"><div class="empty">Nessun mese chiuso con spese in entrambi gli anni.</div></div></div>`;
  const from = annual ? 0 : ST.ym, to = annual ? Lc : ST.ym + 1, n = to - from;
  const P = (y, f = () => true) => spend(x => yOf(x) === y && mOf(x) >= from && mOf(x) < to && f(x));
  const a = P(A), b = P(B), pl = annual ? (Lc < 12 ? `gen–${MESI[Lc - 1].toLowerCase()}` : "anno intero") : cap(MESI_L[ST.ym]);
  const side = (y, v) => `<div><div class="mu">${dotY(y)}${y}</div><div class="big">${eur(v)}</div>${annual ? `<div class="mu">${eur(v / n)} al mese</div>` : ""}</div>`;
  const tot = `<div class="card"><h2>${A} contro ${B} · ${pl}</h2><div class="two">${side(A, a)}${side(B, b)}</div>
 <div style="margin-top:10px">${dchip(b, a)} <span class="mu">${dsum(b - a)} nel ${B} rispetto al ${A}</span></div></div>`;
  const mv = S.cats.flatMap(c => c.subs.map(s => { const g = x => x.cat === c.id && x.sub === s.id; return { n: c.n + " › " + s.n, d: P(B, g) - P(A, g) }; })).filter(z => Math.round(z.d) !== 0);
  const up = mv.filter(z => z.d > 0).sort((p, q) => q.d - p.d).slice(0, 3), dn = mv.filter(z => z.d < 0).sort((p, q) => p.d - q.d).slice(0, 3);
  const mvr = (l, c) => l.map(z => `<div class="prow" style="margin:8px 0"><div class="h" style="margin:0"><span>${esc(z.n)}</span><b class="${c}">${dsum(z.d)}</b></div></div>`).join("") || `<div class="mu">nessuna</div>`;
  const movers = `<div class="card"><h2>Cosa è cambiato di più</h2><div class="two"><div><div class="mu">Più spesa</div>${mvr(up, "up")}</div><div><div class="mu">Meno spesa</div>${mvr(dn, "dn")}</div></div><div class="mu" style="margin-top:8px">Sottocategorie, ${B} rispetto al ${A}, ${pl}.</div></div>`;
  const line = (label, va, vb, mx, id, sub) => { const d = vb - va, t = sub ? "div" : "button", r = Math.round((vb - va) / va * 100), pc = va > 0 ? (r === 0 ? " · 0%" : ` · ${r > 0 ? "+" : "−"}${Math.abs(r)}%`) : vb > 0 ? " · nuova" : "";
    return `<${t} class="cmp ${sub ? "sb" : ""}" ${sub ? "" : `data-act="yx" data-id="${id}"`}><div class="h"><span>${label}</span><span class="${d > 0 ? "up" : d < 0 ? "dn" : "mu"}">${Math.round(d) === 0 ? "=" : (d > 0 ? "▲ " : "▼ ") + dsum(d)}</span></div>
 <div class="trkb s"><i data-w="${va / mx * 100}" style="background:${yc(A)}"></i></div><div class="trkb s"><i data-w="${vb / mx * 100}" style="background:${yc(B)}"></i></div><div class="mu">${A} ${eur(va)} · ${B} ${eur(vb)}${pc}</div></${t}>`; };
  const rows = S.cats.map(c => ({ c, a: P(A, x => x.cat === c.id), b: P(B, x => x.cat === c.id) })).filter(r => r.a || r.b).sort((p, q) => Math.abs(q.b - q.a) - Math.abs(p.b - p.a));
  const mxv = Math.max(1, ...rows.flatMap(r => [r.a, r.b]));
  const list = rows.map(r => { const open = ST.yx === r.c.id; let subs = "";
    if (open) {
      const sr = r.c.subs.map(s => ({ s, a: P(A, x => x.cat === r.c.id && x.sub === s.id), b: P(B, x => x.cat === r.c.id && x.sub === s.id) })).filter(z => z.a || z.b).sort((p, q) => Math.abs(q.b - q.a) - Math.abs(p.b - p.a));
      const mxs = Math.max(1, ...sr.flatMap(z => [z.a, z.b]));
      subs = `<div class="subs">${sr.map(z => line(esc(z.s.n), z.a, z.b, mxs, z.s.id, true)).join("")}</div>`;
    }
    return line(`${ico(r.c.i, 1)} ${esc(r.c.n)} <span class="chev">${open ? "▾" : "▸"}</span>`, r.a, r.b, mxv, r.c.id, false) + subs; }).join("");
  const cats = `<div class="card"><h2>Per categoria</h2><div class="legend" style="margin:0 0 6px">${[A, B].map(y => `<span class="lgi">${dotY(y)}${y}</span>`).join("")}</div>${list || `<div class="empty">Nessuna spesa nel periodo.</div>`}<div class="mu" style="margin-top:8px">Tocca una categoria per vedere le sottocategorie.</div></div>`;
  return `<div class="view">${head}${tot}${movers}${cats}</div>`;
}

/* regola generale: si ridisegna solo cio' che cambia. HTML identico = nessuna modifica al DOM; stessa schermata = nessuna animazione */
const setHTML = (el, h) => { if (el._h === h) return false; el.innerHTML = h; el._h = h; return true; };
let RKEY = null;
// disegna la schermata corrente; ridisegna solo cio' che e' cambiato
function render() {
  const yn = yearsNav(); setHTML($("#yrs"), yn); $("#yrs").classList.toggle("car", yn.includes('class="arr"'));
  setHTML($("#tabs"), [["home", "🏠", "Home"], ["moves", "🧾", "Movimenti"], ["stats", "📊", "Statistiche"], ["sett", "⚙️", "Impostazioni"]].map(t => `<button class="tab ${S.tab === t[0] ? "on" : ""}" data-act="tab" data-t="${t[0]}"><span>${t[1]}</span>${t[2]}</button>`).join(""));
  $("#fab").style.display = S.tab === "sett" ? "none" : "";
  const scs = [...document.querySelectorAll(".mchips")].map(e => e.scrollLeft);
  const key = S.tab + "|" + S.year + "|" + (S.tab === "stats" ? ST.v : ""), still = S.still || key === RKEY; RKEY = key; S.still = false;
  const changed = setHTML($("#view"), { home, moves, stats, sett }[S.tab]());
  if (changed) document.querySelectorAll(".mchips").forEach((e, i) => { if (scs[i]) e.scrollLeft = scs[i]; });
  if (still) document.querySelectorAll("#view .view").forEach(e => e.style.animation = "none");
  const ya = document.getElementById("yall"); if (ya) ya.indeterminate = ya.dataset.part === "1";
  const fill = () => {
    document.querySelectorAll("[data-w]").forEach(e => e.style.width = e.dataset.w + "%");
    document.querySelectorAll("[data-h]").forEach(e => e.style.height = e.dataset.h * .85 + "%");
    document.querySelectorAll(".arc").forEach(e => e.setAttribute("stroke-dasharray", e.dataset.d));
  };
  if (still) {   // stessa schermata: valori subito al loro posto, senza ripartire da zero
    const v = $("#view"); v.classList.add("nt"); fill(); if ($("#rec")) $("#rec").textContent = Math.round(YD(S.year).rec).toLocaleString("it-IT"); void v.offsetWidth; v.classList.remove("nt");
  } else requestAnimationFrame(() => requestAnimationFrame(() => { fill(); if ($("#rec")) count($("#rec"), YD(S.year).rec); }));
}

/* ---------------- nuovo movimento a cerchi ---------------- */
let W = null;
const wEl = () => $("#wheel");
// apre il nuovo movimento a cerchi
function wOpen() {
  if (!S.cats.some(c => !c.arch && c.subs.some(x => !x.arch))) { toast("Crea prima una categoria in Impostazioni"); return; }
  W = { step: "amt", amt: "", kind: "s", who: null, cat: null, sub: null, d: iso(new Date()), note: "", ret: false, more: false, rec: false, freq: "m" };
  wEl().classList.add("on"); wDraw();
}
// chiude il nuovo movimento a cerchi e azzera lo stato
function wClose() { wEl().classList.remove("on"); wEl().innerHTML = ""; W = null; }
// importo digitato come numero
function wAmtNum() { return parseFloat(String(W.amt).replace(",", ".")) || 0; }
// importo digitato come testo da mostrare
function wAmtTxt() { return W.amt === "" ? "0" : W.amt; }
// diametro massimo delle bolle per n bolle su un cerchio, senza sovrapposizioni e dentro il riquadro Z
function wBubD(n, Z) { const k = Math.sin(Math.PI / n) * .9; return Math.min(Z * .3, k * Z / (1 + k)); }
// dispone le bolle su un cerchio di raggio R attorno a (cx, cy)
function wBubs(items, Z, cx, cy, R, d) {
  return items.map((it, i) => {
    const ang = (-90 + 360 * i / items.length) * Math.PI / 180, x = cx + R * Math.cos(ang), y = cy + R * Math.sin(ang);
    return wBub(it, x, y, d, i);
  }).join("");
}
// una bolla (utente, categoria o sottocategoria)
function wBub(it, x, y, d, i) {

/* scorrimento orizzontale (swipe) tra le schede in basso */
const TAB_ORDER = ["home", "moves", "stats", "sett"];
let SW = null;
document.addEventListener("touchstart", e => {
  SW = null;
  if (e.touches.length !== 1 || $("#dlg").open || $("#wheel").classList.contains("on") || $("#login").classList.contains("on") || $("#bio").classList.contains("on")) return;
  for (let el = e.target; el && el !== document.body; el = el.parentElement) {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) || el.isContentEditable) return;      // campi e cursori
    if (el.scrollWidth > el.clientWidth + 1 && /(auto|scroll)/.test(getComputedStyle(el).overflowX)) return; // contenuti già scorrevoli di lato
  }
  const t = e.touches[0]; if (t.clientX < 24 || t.clientX > innerWidth - 24) return; // i bordi sono dei gesti di sistema (indietro)
  SW = { x: t.clientX, y: t.clientY, t: Date.now() };
}, { passive: true });
document.addEventListener("touchend", e => {
  const s = SW; SW = null; if (!s || !e.changedTouches.length) return;
  const t = e.changedTouches[0], dx = t.clientX - s.x, dy = t.clientY - s.y;
  if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.6 || Date.now() - s.t > 700) return;
  const i = TAB_ORDER.indexOf(S.tab), n = i + (dx < 0 ? 1 : -1);
  if (i < 0 || n < 0 || n >= TAB_ORDER.length) return;
  S.tab = TAB_ORDER[n]; S.drill = null; render(); window.scrollTo(0, 0);
  const v = $("#view"); v.classList.remove("swl", "swr"); void v.offsetWidth; v.classList.add(dx < 0 ? "swl" : "swr");
}, { passive: true });
document.addEventListener("click", e => { if (ST.ydd && !e.target.closest(".ddw")) { ST.ydd = false; S.still = true; render(); } });
$("#dlg").addEventListener("click", e => { if (e.target === $("#dlg")) $("#dlg").close(); });

/* ---------------- accesso e avvio ---------------- */
// mostra la schermata di login e svuota la vista
function showLogin() { $("#login").classList.add("on"); $("#view").innerHTML = ""; $("#yrs").innerHTML = ""; }
// accesso con email e password (o creazione dell'account)
let LMODE = "login";
function setLMode(m) {
  LMODE = m; $("#lerr").textContent = "";
  document.querySelectorAll("#login .lmode button").forEach(x => x.classList.toggle("on", x.dataset.m === m));
  $("#lname").style.display = m === "signup" ? "" : "none";
  $("#lpw").autocomplete = m === "signup" ? "new-password" : "current-password";
  $("#lgo").textContent = m === "signup" ? "Crea account" : "Accedi";
}
async function loginPassword() {
  const email = $("#lemail").value.trim(), pw = $("#lpw").value, err = $("#lerr"); err.textContent = "";
  if (!email || !pw) { err.textContent = "Inserisci email e password."; return; }
  if (LMODE === "signup" && pw.length < 8) { err.textContent = "La password deve avere almeno 8 caratteri."; return; }
  const b = $("#lgo"); b.disabled = true;
  const { error } = await sb.auth.signInWithPassword(LMODE, email, pw, $("#lname").value.trim());
  b.disabled = false;
  if (error) { err.textContent = error.message; return; }
  $("#lpw").value = ""; $("#login").classList.remove("on"); start();
}
$("#lpw").addEventListener("keydown", e => { if (e.key === "Enter") loginPassword(); });
// accesso con Google: la pagina viene portata a Google e torna qui con la sessione attiva
async function loginGoogle() { await sb.auth.signInWithOAuth({ provider: "google" }); }
// risposta a un invito per condividere il conto
function askInvite(id, accept) {
  const go = async () => { const code = accept ? ($("#invcode") ? $("#invcode").value : "") : ""; if (accept && !code.trim()) return toast("Inserisci il codice invito"); $("#dlg").close(); const { error } = await sb.rpc("answer_invite", { id, accept, code }); if (error) return toast("Errore: " + error.message); await loadProfile(); await loadAll(); render(); toast(accept ? "Utenze collegate" : "Invito rifiutato"); };
  if (!accept) return go();
  const mine = S.tx.length;
  dlg(`<h2>Collegare le utenze?</h2><div class="mu">${mine ? `I dati che hai ora in questo account (${mine} movimenti) non saranno più visibili: userai quelli della famiglia.` : "Userai gli stessi dati dell'altra utenza."} Il tuo aspetto resta quello che hai scelto.</div><label>Codice invito (te lo dà chi ti ha invitato)</label><input id="invcode" autocomplete="off" autocapitalize="characters" maxlength="12" placeholder="XXXX-XXXX"><button class="btn" id="invok">Collega</button><button class="btn s" data-act="close">Annulla</button>`);
  $("#invok").onclick = go;
}
// avvio dopo l'accesso: verifica l'abilitazione, carica i dati, ascolta le modifiche, genera le ricorrenze, mostra gli inviti
async function start() {
  try {
    const { data: ok } = await sb.rpc("is_member");
    if (!ok) { await sb.auth.signOut(); showLogin(); $("#lerr").textContent = "Account non abilitato."; return; }
    await loadProfile(); await loadAll(); render(); subscribe(); bioLock(); runRecurrences();
    if (P.invites_in.length) { const i = P.invites_in[0]; setTimeout(() => { dlg(`<h2>Invito</h2><div class="mu"><b>${esc(i.from_name)}</b> (${esc(i.from_email)}) ti invita a condividere i conti su DuoFin.</div><button class="btn" data-act="ansinv" data-id="${i.id}" data-v="1">Accetta</button><button class="btn s" data-act="ansinv" data-id="${i.id}" data-v="0">Rifiuta</button><button class="btn s" data-act="close">Decido dopo</button>`); }, 400); }
  } catch (e) { toast("Impossibile caricare i dati: " + (e.message || e)); }
}
(async () => {
  if ("serviceWorker" in navigator) void 0;
  const qs = new URLSearchParams(location.hash.replace(/^#/, "") + "&" + location.search.replace(/^\?/, ""));
  if (qs.get("error_description")) { history.replaceState(null, "", location.pathname); showLogin(); $("#lerr").textContent = "Accesso con Google non riuscito."; return; }
  const { data: { session } } = await sb.auth.getSession();
  $("#lgoogle").style.display = sb.google ? "" : "none";
  if (session) {
    await start();
    const dq = qs.get("drive");
    if (dq) { history.replaceState(null, "", location.pathname); if (dq === "ok") { toast("Google Drive collegato"); await loadProfile(); await driveBackup(); } else toast(dq); }
  } else showLogin();
})();
